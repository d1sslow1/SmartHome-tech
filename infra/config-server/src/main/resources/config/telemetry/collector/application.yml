spring:
  application:
    name: collector

server:
  port: 0  # Случайный порт

grpc:
  server:
    port: 59091
    in-process-name: collector-server

kafka:
  bootstrap-servers: localhost:9092
  topics:
    sensors: telemetry.sensors.v1
    hubs: telemetry.hubs.v1

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.value}
    hostname: localhost
    prefer-ip-address: true

logging:
  level:
    ru.yandex.practicum: DEBUG
    io.grpc: DEBUG
    net.devh: DEBUG
    com.netflix.eureka: DEBUG