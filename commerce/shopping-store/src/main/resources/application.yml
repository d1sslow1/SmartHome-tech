spring:
  application:
    name: shopping-store
  datasource:
    url: jdbc:h2:mem:store-db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

server:
  port: 0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    ru.yandex.practicum: DEBUG